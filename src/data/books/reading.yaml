    content:
      - type: h
        text: The ones that stay
      - type: p
        text: "Books I return to, annotate, and recommend more often than is polite."
      - type: list
        items:
          - "A favorite — why it matters to you"
          - "Another favorite — why it matters to you"
          - "One more — why it matters to you"
  - title: The Stack
    content:
      - type: h
        text: To be read
      - type: p
        text: "A tall, unsteady pile of intentions. It only grows."
      - type: list
        items:
          - "Something you have been meaning to start"
          - "Something recommended by a friend"
          - "Something completely out of your usual lane"